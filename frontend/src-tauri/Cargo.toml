[package]
name = "setlist"
version = "1.4.0"
description = "SetList — AI-powered music library management"
authors = ["jvenuto80"]
license = "MIT"
repository = "https://github.com/jvenuto80/set-list"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
reqwest = { version = "0.12", features = ["json", "blocking"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
